<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hilife Studio – Training &amp; Wellness Center</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--rose:#D9567F;--rose-d:#B93E66;--blush:#FDEFF3;--card:#fff;--ink:#3A2B33;--mute:#7A6670;--line:#F2D6DF;--bg:#FFF8FA;--btn-ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rose:#F07BA2;--rose-d:#E0678F;--blush:#3A2430;--card:#2A1B23;--ink:#FBEFF3;--mute:#C9AEB9;--line:#4C3340;--bg:#1F131A;--btn-ink:#2A1B23}}
:root[data-theme="dark"]{--rose:#F07BA2;--rose-d:#E0678F;--blush:#3A2430;--card:#2A1B23;--ink:#FBEFF3;--mute:#C9AEB9;--line:#4C3340;--bg:#1F131A;--btn-ink:#2A1B23}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding:0 18px 30px}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.9rem;color:var(--rose-d);margin:0 0 10px;line-height:1.1}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.hero{text-align:center;padding:30px 0 6px}
.arch{width:min(74vw,300px);margin:0 auto;background:#fff;border-radius:150px 150px 26px 26px;padding:20px 14px 10px;border:2px solid var(--line)}
.arch img{width:100%;display:block;border-radius:8px}
.badge{display:inline-block;margin-top:16px;padding:6px 15px;border-radius:99px;background:var(--blush);color:var(--rose-d);font-weight:700;font-size:.85rem}
.open{margin:8px 0 0;color:var(--mute);font-size:.92rem}
.links{display:grid;gap:12px;margin-top:24px}
.btn{display:flex;align-items:center;gap:14px;width:100%;padding:17px 20px;border:0;border-radius:20px;background:var(--rose);color:var(--btn-ink);font:700 1.08rem "Nunito Sans",system-ui,sans-serif;text-align:left;text-decoration:none;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--rose-d)}
.btn.alt{background:var(--card);color:var(--rose-d);box-shadow:inset 0 0 0 2px var(--rose)}
.btn svg{flex:0 0 26px;width:26px;height:26px}
.btn small{display:block;font-weight:400;font-size:.82rem;opacity:.9}
#jadwal{margin-top:26px;scroll-margin-top:12px}
#jadwal[hidden]{display:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding-bottom:12px}
.days button{padding:11px 0;text-align:center;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 .9rem "Nunito Sans",system-ui,sans-serif;cursor:pointer}
.days button[aria-selected="true"]{background:var(--rose);border-color:var(--rose);color:var(--btn-ink)}
.dn{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.6rem;font-weight:700;margin:4px 0 10px}
.slot{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:9px}
.slot .t{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:1.35rem;color:var(--rose-d);min-width:58px}
.slot .n{flex:1}
.slot b{display:block}
.slot span{font-size:.85rem;color:var(--mute)}
.slot i{font-style:normal;font-size:.75rem;font-weight:700;background:var(--blush);color:var(--rose-d);border-radius:99px;padding:3px 10px;white-space:nowrap}
.warn{background:var(--blush);border-radius:16px;padding:12px 14px;font-size:.9rem;margin-top:14px}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:30px 0 6px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>
